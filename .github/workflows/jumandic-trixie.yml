name: Build jumandic-trixie

on:
  push:
    tags:
      - "jumandic-trixie/*"
  pull_request:
    paths:
      - ".github/workflows/jumandic-trixie.yml"
      - "jumandic/trixie/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: actions/checkout@v7.0.1
      - uses: shogo82148/actions-setup-perl@v1.44.4
        with:
          perl-version: "5.44"
      - run: |
          ./scripts/build.pl jumandic trixie

      - name: Publish to DockerHub
        if: github.event_name == 'push'
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          printenv PASSWORD | docker login --username "$USERNAME" --password-stdin
          ./scripts/publish.pl jumandic trixie "$USERNAME"
          docker logout

      - name: Publish to GitHub Packages Container registry
        if: github.event_name == 'push'
        env:
          USERNAME: ${{ github.repository_owner }}
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printenv PASSWORD | docker login --username "$USERNAME" --password-stdin ghcr.io
          ./scripts/publish.pl jumandic trixie ghcr.io/"$USERNAME"
          docker logout
