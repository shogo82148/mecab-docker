name: Build jumandic-slim-bookworm

on:
  push:
    tags:
      - "jumandic-slim-bookworm/*"
  pull_request:
    paths:
      - ".github/workflows/jumandic-slim-bookworm.yml"
      - "jumandic/slim-bookworm/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: actions/checkout@v7
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.44"
      - run: |
          ./scripts/build.pl jumandic slim-bookworm

      - name: Publish to DockerHub
        if: github.event_name == 'push'
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          printenv PASSWORD | docker login --username "$USERNAME" --password-stdin
          ./scripts/publish.pl jumandic slim-bookworm "$USERNAME"
          docker logout

      - name: Publish to GitHub Packages Container registry
        if: github.event_name == 'push'
        env:
          USERNAME: ${{ github.repository_owner }}
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printenv PASSWORD | docker login --username "$USERNAME" --password-stdin ghcr.io
          ./scripts/publish.pl jumandic slim-bookworm ghcr.io/"$USERNAME"
          docker logout
